# Everything that has to be true before a change lands.
#
# # What this gates on, and what it deliberately does not
#
# It gates on **the three suites building and passing**, and on the deploy
# configs parsing. It does not gate on `cargo fmt` or on clippy warnings,
# and that is a decision rather than an omission: `cargo fmt --check`
# currently reports over a thousand diffs and clippy 160 warnings, none of
# them errors. Turning either into a gate would mean either a reformat
# touching almost every file in a repository whose owner has not agreed to
# one, or a red pipeline on the first run.
#
# A red pipeline nobody can turn green is worse than no pipeline. People
# learn to ignore it, and then it is also worse than nothing when it goes
# red for a real reason. Clippy still runs, because it catches things
# `cargo build` does not; it is just not asked to enforce a style nobody
# has adopted.
#
# # The part that is doing more than it looks
#
# `ubuntu-latest`. Nothing in this project has ever been built or run on
# Linux -- every check to date was done on macOS, which
# `docs/deployment.md` §11 is explicit about. This workflow is the first
# time the code meets its target platform, and the `deploy-configs` job
# below is the first time `nftables`, `nginx` and `systemd` see the files
# written for them. That closes most of one blocking checklist item
# without anyone provisioning a host.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer
# irrelevant, and the Rust job is the long pole.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Keyed on the lockfile: the workspace's own crates rebuild every
      # run anyway, and it is the dependency tree that is slow to compile.
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        # Single-threaded is not the default and is deliberate here. Parts
        # of the suite bind real TCP ports and spawn real hub instances;
        # `node`'s tests take a process-global lock precisely because they
        # cannot run beside each other. Wall-clock is a few minutes either
        # way, and a flake that only appears under CI's scheduling is the
        # most expensive kind to chase.
        run: cargo test --workspace -- --test-threads=1

      - name: clippy
        # No `-D warnings`. See the header: this catches genuine errors
        # and reports the rest without pretending the repository has
        # adopted a lint policy it has not.
        run: cargo clippy --workspace --all-targets

  python:
    name: python — agent sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The floor `pyproject.toml` declares. Testing on the oldest
          # supported version is the point: the newest one passing says
          # nothing about the version an agent author actually has.
          python-version: "3.10"
      - name: install
        working-directory: agent-sdk-py
        # `[test,mcp]`, not `[test]`. The MCP server's own tests import
        # `mcp` and skip the whole module when it is absent, so with the
        # test extra alone this job had been quietly running 130 of the
        # suite's 166 tests and reporting green -- the MCP server is one
        # of the three onboarding rails and none of its tools had ever
        # been exercised here. Installing it also caught two tools that
        # had no test entry at all.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mcp]"
      - name: test
        working-directory: agent-sdk-py
        # Fail rather than skip if the extra ever goes missing again:
        # a skipped module is invisible in a green summary, which is the
        # whole reason this went unnoticed.
        run: pytest -q -W error::pytest.PytestUnraisableExceptionWarning
      - name: the mcp tests actually ran
        working-directory: agent-sdk-py
        run: |
          set -euo pipefail
          collected=$(pytest --collect-only -q tests/test_mcp_server.py | tail -1)
          echo "$collected"
          case "$collected" in
            *"no tests"*|*"0 tests"*)
              echo "::error file=agent-sdk-py/tests/test_mcp_server.py::the mcp tests collected nothing -- the [mcp] extra is missing again"
              exit 1 ;;
          esac

  dashboard:
    name: dashboard — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: install
        working-directory: dashboard
        run: npm ci
      - name: typecheck
        # Its own step rather than relying on `npm run build`, so a type
        # error reports as a type error. This is the check that would have
        # caught the status union falling behind the hub.
        working-directory: dashboard
        run: npx tsc -b --force
      - name: test
        working-directory: dashboard
        run: npm test
      - name: build
        working-directory: dashboard
        run: npm run build

  deploy-configs:
    name: deploy — parse the configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the software that runs them
        run: sudo apt-get update && sudo apt-get install -y nftables nginx

      - name: nftables
        # `-c` checks and does not apply. Under sudo because nft parses
        # against the running kernel's capabilities even in check mode.
        run: sudo nft -c -f deploy/nftables.conf

      - name: nginx
        # Two pieces of scaffolding, both of which the first run of this
        # job is what established.
        #
        # `deploy/nginx.conf` is a **fragment** -- two bare `server`
        # blocks meant for `sites-available/`, not a whole config. Handed
        # to `nginx -t -c` as-is it fails with "server directive is not
        # allowed here", which says nothing about the file being wrong.
        # So it gets wrapped in the minimal `events`/`http` scaffold an
        # include would have supplied.
        #
        # And the cert paths it names do not exist in a checkout, while
        # `nginx -t` reads them, so a throwaway self-signed pair stands
        # in. This validates *syntax and directives* -- the class of
        # error §11 says was never checked -- not that the deployment
        # works.
        run: |
          sudo mkdir -p /etc/ssl/itx
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /etc/ssl/itx/test.key -out /etc/ssl/itx/test.crt \
            -subj "/CN=itx.test" 2>/dev/null
          # POSIX character classes, not \s: that is a GNU extension, and
          # a workflow that only parses on one sed is the kind of thing
          # this job exists to catch elsewhere. Key first, so the shorter
          # directive name cannot shadow the longer one.
          sed -E 's#(ssl_certificate_key)[[:space:]]+[^;]+;#\1 /etc/ssl/itx/test.key;#; s#(ssl_certificate)[[:space:]]+[^;]+;#\1 /etc/ssl/itx/test.crt;#' \
            deploy/nginx.conf > /tmp/itx-site.conf
          {
            echo 'events {}'
            echo 'http {'
            echo '  include /etc/nginx/mime.types;'
            echo '  default_type application/octet-stream;'
            cat /tmp/itx-site.conf
            echo '}'
          } > /tmp/nginx-itx.conf
          sudo nginx -t -c /tmp/nginx-itx.conf

      - name: caddy
        # The preferred proxy, and until now the unvalidated one -- the
        # job checked nginx and left the config the docs actually
        # recommend to a human's eye. It grew a second site block when
        # the dashboard got a home, which is exactly when that stops
        # being acceptable.
        #
        # `caddy validate` reads no certificate paths, so unlike nginx
        # this needs no stand-in certificates. It does, however, do more
        # than `adapt`: it *provisions* every module in the adapted
        # config, and the `log` directive's file writer opens its file to
        # do that. This step therefore failed on its first-ever run with
        #
        #   Error: setting up custom log 'log0': ... open
        #   /var/log/caddy/itx-access.log: permission denied
        #
        # -- the config the docs recommend logs to /var/log/caddy, the
        # caddy package creates that directory owned by the caddy user,
        # and the step runs as the runner. Nothing was wrong with the
        # Caddyfile; the check could not get far enough to say so.
        #
        # `install -d` rather than `mkdir -p` because the directory
        # already exists from the package, so ownership is the part that
        # has to change. Hardcoding the runner user would be wrong on a
        # self-hosted runner, hence `id -un`.
        #
        # The `automatic HTTPS` warnings about the example domain are
        # expected and are not failures, and neither are the
        # `Unnecessary header_up X-Forwarded-For` warnings -- deploy/Caddyfile
        # explains at length why that line stays.
        run: |
          set -euo pipefail
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update && sudo apt-get install -y caddy
          sudo install -d -o "$(id -un)" /var/log/caddy
          caddy validate --config deploy/Caddyfile --adapter caddyfile

      - name: systemd units
        # `systemd-analyze verify` reports missing executables and users,
        # which a checkout will not have, so those specific complaints are
        # filtered and anything else fails the step. Syntax, directive
        # names and unit ordering are what this is here to catch.
        run: |
          set -o pipefail
          for unit in deploy/*.service; do
            echo "== $unit"
            out=$(systemd-analyze verify "$unit" 2>&1 || true)
            echo "$out"
            # Drop the two classes a checkout cannot satisfy.
            real=$(echo "$out" | grep -v "Command .* is not executable" \
                               | grep -v "Unit configured to use KillMode=none" \
                               | grep -vE "Failed to (resolve|open) .*(user|group)" \
                               | grep -vE "^\s*$" || true)
            if [ -n "$real" ]; then
              echo "::error file=$unit::systemd-analyze reported problems beyond the missing binaries a checkout cannot have"
              exit 1
            fi
          done

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # A real gate. It was `continue-on-error` when it was first written,
    # on the grounds that advisories appear without anyone pushing and so
    # should not be able to turn a green commit red retroactively. That
    # was the wrong shape: a job that can never fail is a job nobody
    # reads, and the next advisory -- the one that does reach the hub --
    # would arrive invisibly behind a badge that was already red.
    #
    # It gates now, with exactly one advisory ignored by name and a check
    # that the ignore has not gone stale. The reasoning, and what would
    # change it, is in `docs/dependency-audit.md`.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo audit
        # RUSTSEC-2022-0040 (`owning_ref`, multiple soundness issues) has
        # no fixed version and never will -- the holes are in its API, so
        # a fix would break every caller, and the crate is unmaintained.
        # It reaches this tree only through `cursive` in the wallet's
        # terminal UI: zero paths from hub, node, miner or console, and
        # the wallet is not in the release artifact. See
        # `docs/dependency-audit.md` for the full argument and for what
        # would make this line wrong.
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          IGNORED=RUSTSEC-2022-0040
          cargo audit --ignore "$IGNORED"

          # The ignore's own expiry check. If `cursive` ever migrates off
          # `owning_ref`, the line above stops describing anything and
          # starts being a place for the next advisory to hide. Failing
          # here is a one-line cleanup, and it is the only thing that
          # stops an ignore list rotting quietly.
          #
          # Captured before grepping rather than piped into it. Under
          # `set -o pipefail` the pipeline reports *cargo audit's* exit
          # status -- non-zero whenever it finds anything -- so `if !`
          # was true even when the string was present, and this check
          # fired on its first run against a tree the advisory still
          # applies to. It failed loudly rather than silently, which is
          # the one thing it got right.
          report=$(cargo audit --json 2>/dev/null || true)
          if ! grep -q "$IGNORED" <<<"$report"; then
            echo "::error file=.github/workflows/ci.yml::${IGNORED} no longer fires -- delete the --ignore and this check, and update docs/dependency-audit.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: npm audit
        working-directory: dashboard
        # Nothing ignored here, and nothing needs to be: every advisory
        # this found had a fix available and the fixes are taken.
        run: |
          npm ci
          npm audit --audit-level=high
