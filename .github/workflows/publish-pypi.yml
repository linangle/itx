# Publishes `agent-sdk-py` to PyPI through Trusted Publishing (OIDC): the
# workflow proves its identity to PyPI with a short-lived token minted per
# run, so no API token is stored anywhere -- not in repository secrets,
# not on a laptop. That is a deliberate choice (docs/agent-ecosystem-plan.md
# §7.3 step 5): a long-lived publishing token is the credential class a
# leak turns into a supply-chain incident.
#
# One-time setup on PyPI, done by a human in the browser, before the first
# run: Account settings -> Publishing -> "Add a new pending publisher" with
#   PyPI project name : itx-agent-sdk
#   Owner             : linangle
#   Repository        : itx
#   Workflow name     : publish-pypi.yml
#   Environment name  : pypi
# (and the same on test.pypi.org with environment `testpypi`). The first
# successful publish creates the project; no token is ever issued.
#
# Releasing: bump `version` in agent-sdk-py/pyproject.toml and
# agent-sdk-py/server.json, add a CHANGELOG entry, then push a tag named
# `sdk-v<version>` (the `sdk-` prefix keeps the SDK's tags apart from the
# Rust crates'). Or run the workflow by hand and pick the index.

name: publish itx-agent-sdk

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sdk-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the package with every extra
        run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[test,mcp]"
      - name: run the test suite
        run: python -m pytest -q
      # Unconditional, not `if: startsWith(github.ref, ...)`. A
      # workflow_dispatch run publishes the same artifact a tag push
      # would, so leaving it unchecked meant the one publishing route a
      # human drives by hand was the one route with no version check on
      # it. Only the tag comparison needs a tag; the rest does not.
      - name: refuse versions that disagree across pyproject.toml, server.json and the tag
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          registry="$(python -c 'import json; d = json.load(open("server.json")); print(d["version"], d["packages"][0]["version"])')"
          echo "pyproject=$version server.json=$registry ref=$GITHUB_REF_NAME"
          test "$registry" = "$version $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#sdk-v}" = "$version"
          fi
      - name: build the sdist and wheel
        run: python -m build
      - name: check the distributions render on PyPI
        run: python -m twine check dist/*
      # An editable install from the source tree proves the tests pass; it
      # does not prove the *wheel* installs, or that the console scripts
      # it declares actually resolve and start. That gap is how a registry
      # entry naming a non-existent executable (`itx-agent-sdk`) shipped
      # once already, so the built artifact is installed clean and every
      # entry point in it is run before anything is published.
      - name: install the built wheel clean and start every console script
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          wheel="$(ls dist/*.whl)"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet "${wheel}[mcp]"
          for script in itx-agent itx-agent-mcp-server itx-agent-sdk; do
            echo "running $script --help"
            "$RUNNER_TEMP/smoke/bin/$script" --help > /dev/null
          done
      # The command the MCP registry composes from server.json is
      # `<runtimeHint> <runtimeArguments...> <identifier>`. Both halves
      # are read back out of the file here rather than retyped, and
      # pointed at the wheel about to be published -- the version
      # server.json names is not on PyPI until this workflow succeeds.
      - name: run the command the MCP registry will generate from server.json
        run: |
          python -m pip install --quiet uv
          identifier="$(python -c 'import json; print(json.load(open("server.json"))["packages"][0]["identifier"])')"
          # e.g. the "[mcp]" left over from "itx-agent-sdk[mcp]" once the
          # identifier itself is taken off the front of --from's value.
          extras="$(python -c 'import json; p = json.load(open("server.json"))["packages"][0]; print(next(a["value"] for a in p["runtimeArguments"] if a.get("name") == "--from")[len(p["identifier"]):])')"
          echo "registry command: uvx --from ${identifier}${extras} ${identifier}"
          uv tool run --no-cache --from "$(ls dist/*.whl)${extras}" "$identifier" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: agent-sdk-py/dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
