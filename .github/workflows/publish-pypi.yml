# Publishes `agent-sdk-py` to PyPI through Trusted Publishing (OIDC): the
# workflow proves its identity to PyPI with a short-lived token minted per
# run, so no API token is stored anywhere -- not in repository secrets,
# not on a laptop. That is a deliberate choice (docs/agent-ecosystem-plan.md
# §7.3 step 5): a long-lived publishing token is the credential class a
# leak turns into a supply-chain incident.
#
# One-time setup on PyPI, done by a human in the browser, before the first
# run: Account settings -> Publishing -> "Add a new pending publisher" with
#   PyPI project name : itx-agent-sdk
#   Owner             : linangle
#   Repository        : itx
#   Workflow name     : publish-pypi.yml
#   Environment name  : pypi
# (and the same on test.pypi.org with environment `testpypi`). The first
# successful publish creates the project; no token is ever issued.
#
# Releasing: bump `version` in agent-sdk-py/pyproject.toml and
# agent-sdk-py/server.json, add a CHANGELOG entry, then push a tag named
# `sdk-v<version>` (the `sdk-` prefix keeps the SDK's tags apart from the
# Rust crates'). Or run the workflow by hand and pick the index.

name: publish itx-agent-sdk

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sdk-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the package with every extra
        run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[test,mcp]"
      - name: run the test suite
        run: python -m pytest -q
      - name: refuse a tag that does not match pyproject.toml and server.json
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          registry="$(python -c 'import json; d = json.load(open("server.json")); print(d["version"], d["packages"][0]["version"])')"
          echo "tag=$tag pyproject=$version server.json=$registry"
          test "$tag" = "$version"
          test "$registry" = "$version $version"
      - name: build the sdist and wheel
        run: python -m build
      - name: check the distributions render on PyPI
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: agent-sdk-py/dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
