[package]
name = "hub"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
btclib = { path = "../lib" }
anyhow = "1.0.86"
argh = "0.1.12"
axum = "0.7"
chrono = { workspace = true }
ciborium = { workspace = true }
dashmap = "5.5.3"
# Escrow deposit keys are derived rather than stored -- see
# `src/escrow_key.rs`. Both are RustCrypto crates on the same `digest 0.10`
# generation the `k256`/`ecdsa` stack btclib already builds on, so this adds
# no second copy of any hashing primitive to the tree.
hkdf = "0.12"
sha2 = "0.10"
redb = "2"
serde = { workspace = true }
serde_json = "1.0"
rand = { workspace = true }
static_init = "1.0.3"
thiserror = { workspace = true }
tokio = { version = "1.37.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Only pulled in for the `examples/smoke_agent.rs` end-to-end HTTP smoke
# test -- never part of the shipped `hub` binary's dependency tree.
reqwest = { version = "0.12", features = ["json"] }
sdk = { path = "../sdk" }
# One test in `faucet_pow` hashes a preimage the way a non-Rust client
# would, to pin the byte-order convention `Hash` uses. Reaching for the
# digest directly is the point -- going through `Hash` would test the
# convention against itself.
sha256 = { workspace = true }
