# ITX reverse proxy -- nginx edition.
#
# Use deploy/Caddyfile unless you have a reason not to: this file has
# more places to make a quiet mistake, and three of them (the
# X-Forwarded-For source, the two body timeouts, and the certificate
# paths) are load-bearing.
#
# Copy to /etc/nginx/sites-available/itx, symlink into sites-enabled,
# then:  sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: obtain with `certbot certonly --nginx -d itx.example.com`
# and let certbot own the renewal timer. Unlike Caddy, nothing here
# renews on its own.
#
# See docs/deployment.md §4 for the X-Forwarded-For reasoning.

# Cleartext exists only to send clients to TLS. No proxy_pass here: an
# http:// listener that forwards to the hub is a TLS bypass wearing a
# redirect's clothes.
server {
    listen 80;
    listen [::]:80;
    server_name itx.example.com;

    # The one path that legitimately answers over cleartext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itx.example.com;

    ssl_certificate     /etc/letsencrypt/live/itx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itx.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Two years, and only set here -- never on the :80 block, where a
    # client that has not yet been upgraded would cache it from an
    # unauthenticated response.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Body cap: see the Caddyfile's note. axum's own default is 2MB;
    # no ITX payload is close.
    client_max_body_size 64k;

    # Slowloris bounds. nginx's defaults are 60s each, which is a long
    # time to hold a worker for a client sending one byte a minute.
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     75s;

    access_log /var/log/nginx/itx-access.log;
    error_log  /var/log/nginx/itx-error.log warn;

    # RFC 9116 disclosure contact. Served here because the hub's router
    # has no route for it. An exact-match location outranks the catch-all
    # below regardless of order, but it is written first anyway so the
    # exception is visible before the rule.
    #     sudo install -Dm644 deploy/security.txt \
    #         /etc/nginx/well-known/security.txt
    location = /.well-known/security.txt {
        alias /etc/nginx/well-known/security.txt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        # THE security-relevant line.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The usual idiom
        # appends the peer to whatever the client sent; the hub reads
        # right to left past its own proxies (hub/src/rate_limit.rs,
        # client_ip) so that would in fact be safe today. Replacing makes
        # it safe under any reader: exactly one entry, the one we saw,
        # with the client's own claim discarded here.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Client-supplied variants the hub does not read today. Cleared
        # so they cannot become a bypass if it ever does. An empty value
        # is how nginx removes a header from the upstream request.
        proxy_set_header Forwarded  "";
        proxy_set_header X-Real-IP  "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # The hub already gzips (CompressionLayer in build_router), so
        # nginx must not try to as well. It must, however, be willing to
        # pass a compressed response through untouched.
        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }
}
