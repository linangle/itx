# ITX reverse proxy -- nginx edition.
#
# Use deploy/Caddyfile unless you have a reason not to: this file has
# more places to make a quiet mistake, and three of them (the
# X-Forwarded-For source, the two body timeouts, and the certificate
# paths) are load-bearing.
#
# Copy to /etc/nginx/sites-available/itx, symlink into sites-enabled,
# then:  sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: TWO of them, one per server_name, and they must be two
# separate lineages because the two server blocks below name two separate
# paths under /etc/letsencrypt/live/. Issue them BEFORE this file is
# enabled, with nginx not yet running, using certbot's own listener:
#
#   sudo certbot certonly --standalone -d itx.example.com \
#        --pre-hook 'systemctl stop nginx' --post-hook 'systemctl start nginx'
#   sudo certbot certonly --standalone -d hub.itx.example.com \
#        --pre-hook 'systemctl stop nginx' --post-hook 'systemctl start nginx'
#
# then install this file, `nginx -t`, `systemctl enable --now nginx`, and
# prove the renewal path while you are still looking:
#
#   sudo certbot renew --dry-run
#
# Why not `--nginx`: the two 443 blocks below reference certificate files
# that do not exist until certbot has run, nginx refuses to start on a
# missing certificate, and the nginx authenticator needs a running nginx
# to drive -- so on a fresh box the documented `certonly --nginx` had
# nothing to work with. Why the hooks: `certonly` records no installer,
# so a renewal that succeeds leaves nginx serving the expired certificate
# until something restarts it -- sixty days after a clean launch,
# silently. The hooks are recorded in the renewal configuration and run
# on every renewal: nginx is down for the seconds the challenge takes.
# (The `/.well-known/acme-challenge/` location in the :80 block is not
# used by this flow; it is kept for anyone who switches to `--webroot`.)
#
# Not `-d itx.example.com -d hub.itx.example.com`. That is one lineage
# covering both names, directory-named after the first -d, and the hub
# block's ssl_certificate path would not exist -- `nginx -t` fails on the
# missing file, which is a confusing way to be told you ran the wrong
# certbot command. This file asked for a single certificate while
# referencing two lineages until 2026-09-10.
#
# Let certbot own the renewal timer. Unlike Caddy, nothing here renews on
# its own.
#
# See docs/deployment.md §4 for the X-Forwarded-For reasoning.

# Cleartext exists only to send clients to TLS. No proxy_pass here: an
# http:// listener that forwards to the hub is a TLS bypass wearing a
# redirect's clothes.
server {
    listen 80;
    listen [::]:80;
    # Both names: the site and the API each need the ACME path and the
    # redirect, and one block covers them.
    server_name itx.example.com hub.itx.example.com;

    # The one path that legitimately answers over cleartext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 as a `listen` parameter, not the newer `http2 on;`
    # directive. `http2 on;` needs nginx >= 1.25.1 and is a hard
    # `nginx -t` failure below it -- which rules out Ubuntu 24.04
    # (nginx 1.24.0) and Debian 12 (1.22.1), the two distributions this
    # document is written against. The parameter form works on every
    # version from 1.9.5 up; on 1.25.1 and later it is deprecated and
    # `nginx -t` says so, but it still enables HTTP/2. A warning on new
    # nginx beats a refusal to start on the nginx people actually have.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # The API, on its own hostname. Two names rather than one with the
    # hub under `/api`, and that is a correctness requirement rather than
    # taste: the signed envelope binds the concrete request path, so
    # mounting the hub under a prefix makes every authenticated request
    # fail its own signature (§4.6). The hub's CORS layer already allows
    # any origin for GETs, which is what the site needs and nothing more.
    server_name hub.itx.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.itx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.itx.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Deliberately NO `ssl_stapling`. It was on here, and it was two
    # bugs at once: OCSP stapling needs a `resolver` to look the OCSP
    # responder up, and without one nginx logs
    # "ssl_stapling ignored, no resolver defined" and staples nothing --
    # so it never did anything. And Let's Encrypt has since dropped OCSP
    # entirely, so there is no responder left to staple from. Turning it
    # on with a resolver today would only add a failing lookup to every
    # handshake path.

    # Two years, and only set here -- never on the :80 block, where a
    # client that has not yet been upgraded would cache it from an
    # unauthenticated response.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Body cap: see the Caddyfile's note for the derivation. 256k here
    # is 262,144 bytes, which is exactly what the Caddyfile's
    # `max_size 262144` is -- these two used to read `64k` and `64KB`
    # and differ by 1,536 bytes, because nginx's k is 1024 and Caddy's
    # KB is 1000. Short version of the derivation: the hub accepts
    # 20,000-character text fields, the SDK escapes non-ASCII as \uXXXX,
    # and an emoji costs 12 bytes that way, so 240,000 bytes is a body
    # the hub would accept and the proxy must not 413.
    client_max_body_size 256k;

    # Slowloris bounds. nginx's defaults are 60s each, which is a long
    # time to hold a worker for a client sending one byte a minute.
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     75s;

    access_log /var/log/nginx/itx-access.log;
    error_log  /var/log/nginx/itx-error.log warn;

    # RFC 9116 disclosure contact. Served here because the hub's router
    # has no route for it. An exact-match location outranks the catch-all
    # below regardless of order, but it is written first anyway so the
    # exception is visible before the rule.
    #     sudo install -Dm644 deploy/security.txt \
    #         /etc/nginx/well-known/security.txt
    location = /.well-known/security.txt {
        alias /etc/nginx/well-known/security.txt;
        default_type text/plain;
        # RFC 9116 §3 requires the file be served as UTF-8, and nginx
        # will not say so on its own -- `default_type text/plain` alone
        # emits a Content-Type with no charset. `charset` appends it
        # (text/plain is in nginx's default charset_types), matching what
        # the Caddyfile sets by hand.
        charset utf-8;
    }

    # `/metrics` is not for the internet. It carries the custody balance,
    # the exchange's liabilities, the faucet budget's remaining headroom
    # and the reconciliation disagreement counters -- an operational
    # picture of the treasury, unauthenticated, on a route the hub does
    # not gate because inside the box it does not need to be.
    #
    # Shipped blocked rather than left to the operator. The runbook has
    # said to add this since the metrics endpoint landed, and neither
    # shipped config contained it, so the documented state and the
    # shipped state disagreed -- which is the same as not documenting it.
    # Scrape from the box (`curl -s localhost:9100/metrics`), or add the
    # monitoring host to the allow list.
    #
    # Exact match, so it cannot be walked around with `/metrics/` or a
    # query string, and it outranks the prefix location below regardless
    # of order.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location / {
        # `proxy_pass` with no URI part -- no trailing slash, no path
        # after the port. That is what makes nginx pass the request path
        # through byte-for-byte, and it is load-bearing. The signed
        # envelope binds method and concrete path, and the hub verifies
        # against `OriginalUri`, so adding a trailing slash here (or
        # mounting the hub under /api) rewrites the path out from under
        # the signature: every authenticated request 401s, all of them,
        # with nothing in either log explaining it. See
        # docs/deployment.md §4.6.
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        # THE security-relevant line.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The usual idiom
        # appends the peer to whatever the client sent; the hub reads
        # right to left past its own proxies (hub/src/rate_limit.rs,
        # client_ip) so that would in fact be safe today. Replacing makes
        # it safe under any reader: exactly one entry, the one we saw,
        # with the client's own claim discarded here.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Client-supplied variants the hub does not read today. Cleared
        # so they cannot become a bypass if it ever does. An empty value
        # is how nginx removes a header from the upstream request.
        proxy_set_header Forwarded  "";
        proxy_set_header X-Real-IP  "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # The hub already gzips (CompressionLayer in build_router), so
        # nginx must not try to as well. It must, however, be willing to
        # pass a compressed response through untouched.
        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # See the site block's copy for why 502 and 504 only, and why
        # the hub's own `degraded` 503 must not be caught here.
        error_page 502 504 = @api_down;
    }

    # The API's hub-is-down body. JSON on every path and no HTML
    # anywhere: everything that reaches this hostname is a program -- the
    # SDK, the MCP server, an agent's own client -- and the status page
    # is a human surface that lives on the apex.
    #
    # 503 rather than 502 deliberately. A 502 says the gateway got a bad
    # answer; 503 says the service is unavailable and names a time to
    # come back, which is both what is true and what a retrying client
    # is written against.
    location @api_down {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        # This location sets add_header, so it inherits none -- including
        # the server block's HSTS, whose max-age here is the API's two
        # years rather than the site's one.
        add_header Strict-Transport-Security "max-age=63072000" always;

        # An absolute path, not $document_root: this server block serves
        # no files and so has no root for the variable to resolve. It
        # must name the same file the site block's gate reads, and the
        # same one deploy/Caddyfile's `file` matcher is given a `root`
        # for.
        if (-f /var/www/itx/maintenance.flag) {
            return 503 '{"status":"maintenance","error":"planned maintenance: the hub is stopped. retry shortly; a signed envelope refused here was not spent."}';
        }
        return 503 '{"status":"unavailable","error":"the hub did not answer this proxy"}';
    }
}

# The site. Static files, no hub behind it, and the only thing a human
# visiting the domain reaches.
#
#     sudo cp -r site/. /var/www/itx/      # from the release tarball
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itx.example.com;

    ssl_certificate     /etc/letsencrypt/live/itx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itx.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # THE nginx trap, and it is the reason these three appear again in
    # both locations below.
    #
    # `add_header` does not accumulate down the tree the way most
    # directives do: a block that sets ANY `add_header` of its own
    # inherits NONE from its parent. Both site locations set
    # `Cache-Control`, so from the moment they did, these three stopped
    # being sent from the site entirely -- every page, every asset, no
    # HSTS, no nosniff, no referrer policy -- while sitting right here in
    # the config looking correct. `always` does not help; it governs
    # error responses, not inheritance.
    #
    # Repeated rather than factored into an include, because an include
    # is a second file to install and this file's whole premise is that
    # it is the one that is harder to get right. Caddy is unaffected: its
    # `header` directive is not scoped this way.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/itx;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/itx-site-access.log;
    error_log  /var/log/nginx/itx-site-error.log warn;

    # Vite emits content-addressed filenames, so an asset under /assets/
    # can be cached hard: a changed file is a changed name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeated from the server block: setting Cache-Control above
        # cancels every inherited add_header. See the note there.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Four paths that are NOT the single-page app.
    #
    # The `location /` below answers every unknown path with index.html
    # and a 200, which is right for a route the router owns and wrong for
    # a file the outside world was told to fetch. Until 2026-09-09 that
    # swallowed three of these: `/llms.txt` served a page of HTML to
    # an agent expecting the manual, `/.well-known/security.txt` served
    # HTML to a researcher, and `/health` answered 200 with the hub dead
    # -- which is what §3's off-box check and §8.2's monitoring curl. A
    # 200 full of markup is the worst answer available: it satisfies a
    # status-code check and means nothing.
    #
    # An exact-match location outranks a prefix one and a regex outranks
    # both, so all four win over `location /` wherever they are written.

    # The public status page, and the file it is. See docs/deployment.md
    # §4.8; the page itself explains why it is static.
    #
    # Both are exact matches and neither carries the maintenance gate
    # `location /` has, which is the part that is not optional. During a
    # window `location /` returns 503, `error_page 503 /status.html`
    # internally redirects to /status.html, and if that landed back in
    # `location /` the gate would fire again -- nginx would spend ten
    # redirects and then answer 500 "rewrite or internal redirection
    # cycle". The exact match is what breaks the loop.
    location = /status {
        add_header Cache-Control "no-store" always;
        # Repeated from the server block: setting Cache-Control cancels
        # every inherited add_header. See the note there.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /status.html =404;
    }

    location = /status.html {
        add_header Cache-Control "no-store" always;
        # This is the location the maintenance 503 is internally
        # redirected to, and response headers come from where a request
        # *ends up*, so `Retry-After` has to be set here rather than
        # beside the `return 503` that sent it. It rides along on a
        # direct 200 hit of this path too, where it has no defined
        # meaning and is ignored -- `Retry-After` is acted on with 503,
        # 429 and 3xx and nowhere else.
        add_header Retry-After 300 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # RFC 9116 disclosure contact, on the apex because that is where
    # `Canonical:` in the file itself says it lives, and where a
    # researcher and every automated scanner look first. Same file and
    # same install step as the API block's copy:
    #     sudo install -Dm644 deploy/security.txt \
    #         /etc/nginx/well-known/security.txt
    location = /.well-known/security.txt {
        alias /etc/nginx/well-known/security.txt;
        default_type text/plain;
        charset utf-8;
    }

    # `/llms.txt` and `/health`, forwarded to the hub.
    #
    # The manual is served by the hub itself so it cannot drift from the
    # running constants, and the README's one-line paste hands a stranger
    # the site's domain -- an agent should not have to know the API is on
    # another hostname to read the instructions for using it. `/health`
    # is the one §3 says to curl from another machine, and it has to
    # reach the hub to mean anything.
    #
    # `proxy_pass` with no URI part, as in the API block: that is what
    # passes the path through byte-for-byte, and it is the only form
    # allowed in a regex location anyway.
    #
    # The five header lines are the API block's, and MUST stay identical
    # to them -- `$remote_addr` rather than `$proxy_add_x_forwarded_for`
    # is the security-relevant one, and the hub's rate limiter charges by
    # the address it is handed. nginx has no snippets without a second
    # file to install, which is why this is a copy; deploy/Caddyfile
    # states them once and imports them twice.
    location ~ ^/(llms\.txt|health)$ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Forwarded  "";
        proxy_set_header X-Real-IP  "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # What these two answer when the hub is not there. Without it a
        # stopped hub gives nginx's own HTML 502 page to monitoring and
        # to an arriving agent, which is the same mistake the comment
        # block above fixed from the other direction.
        #
        # 502 and 504 only, and `proxy_intercept_errors` is left off
        # (the default): a hub that *answers* 503 -- `{"status":
        # "degraded"}`, node unreachable, hub fine -- has been proxied
        # successfully, and that body must reach the client unaltered.
        # §8.2 alerts on degraded and unavailable differently, so folding
        # one into the other here would be a monitoring bug.
        error_page 502 504 = @hub_down;
    }

    # The apex's hub-is-down body: JSON for `/health`, a plain-text note
    # for `/llms.txt`, and the maintenance wording for either while the
    # flag is up. Same four answers deploy/Caddyfile gives.
    #
    # One named location covers both paths because nginx picks the media
    # type from the request URI before `default_type` is consulted:
    # `/llms.txt` gets text/plain from mime.types on the extension, and
    # `/health` -- no extension -- falls through to the
    # `default_type` below. That is what makes the split cheap. It is
    # also what makes getting it half-right invisible: returning JSON on
    # both paths still answers `/llms.txt` as text/plain, so the label
    # and the body disagree and nothing complains. Verified by curling
    # both, not by reading this.
    #
    # Two `if`s and no nesting, because nginx has no `and`: the flag
    # picks the wording, the path picks which wording is sent. `set` and
    # `return` are the directives that behave inside `if`.
    location @hub_down {
        default_type application/json;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        # This location sets add_header, so it inherits none. Same trap
        # as /assets/ and `location /`.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set $itx_down_json '{"status":"unavailable","error":"the hub did not answer this proxy"}';
        set $itx_down_text "itx is not answering. this file is served by the hub, which is down. retry shortly.";

        # The same flag file the maintenance gate below reads.
        if (-f $document_root/maintenance.flag) {
            set $itx_down_json '{"status":"maintenance","error":"planned maintenance: the hub is stopped"}';
            set $itx_down_text "itx is down for planned maintenance. this file is served by the hub, which is stopped. retry shortly; nothing you signed has been spent.";
        }

        if ($uri = /llms.txt) {
            return 503 $itx_down_text;
        }
        return 503 $itx_down_json;
    }

    # Single-page app. An unknown path is a route the router owns, not a
    # missing file, so it gets index.html and React decides -- a real 404
    # for /nothing-here would break every deep link on the site.
    #
    # index.html itself is never cached: it is what points at the current
    # asset hashes, and a stale copy serves a bundle that no longer exists.
    location / {
        add_header Cache-Control "no-cache" always;
        # Repeated from the server block, same reason as /assets/: this
        # location sets a Cache-Control, so it inherits nothing.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Planned maintenance, declared by a file rather than by editing
        # this config -- nothing here is reloaded to open or close a
        # window:
        #
        #     sudo touch /var/www/itx/maintenance.flag    # window opens
        #     sudo rm    /var/www/itx/maintenance.flag    # window closes
        #
        # Only the app is behind it. `/status`, `/.well-known/
        # security.txt`, `/llms.txt` and `/health` are all matched by
        # locations that outrank this one, so a window never hides the
        # status page, the disclosure contact, or the real answer from
        # the hub while it is still running. See docs/deployment.md §4.8.
        if (-f $document_root/maintenance.flag) {
            return 503;
        }
        # Serves the status page as the body of that 503 -- and of a 503
        # only, so nothing else is rerouted. The status code is kept
        # because there is no `=` here: a maintenance page that answered
        # 200 would be indexed as the site's content.
        error_page 503 /status.html;

        try_files $uri $uri/ /index.html;
    }
}
