# ITX reverse proxy -- nginx edition.
#
# Use deploy/Caddyfile unless you have a reason not to: this file has
# more places to make a quiet mistake, and three of them (the
# X-Forwarded-For source, the two body timeouts, and the certificate
# paths) are load-bearing.
#
# Copy to /etc/nginx/sites-available/itx, symlink into sites-enabled,
# then:  sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: obtain with `certbot certonly --nginx -d itx.example.com`
# and let certbot own the renewal timer. Unlike Caddy, nothing here
# renews on its own.
#
# See docs/deployment.md §4 for the X-Forwarded-For reasoning.

# Cleartext exists only to send clients to TLS. No proxy_pass here: an
# http:// listener that forwards to the hub is a TLS bypass wearing a
# redirect's clothes.
server {
    listen 80;
    listen [::]:80;
    # Both names: the site and the API each need the ACME path and the
    # redirect, and one block covers them.
    server_name itx.example.com hub.itx.example.com;

    # The one path that legitimately answers over cleartext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 as a `listen` parameter, not the newer `http2 on;`
    # directive. `http2 on;` needs nginx >= 1.25.1 and is a hard
    # `nginx -t` failure below it -- which rules out Ubuntu 24.04
    # (nginx 1.24.0) and Debian 12 (1.22.1), the two distributions this
    # document is written against. The parameter form works on every
    # version from 1.9.5 up; on 1.25.1 and later it is deprecated and
    # `nginx -t` says so, but it still enables HTTP/2. A warning on new
    # nginx beats a refusal to start on the nginx people actually have.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # The API, on its own hostname. Two names rather than one with the
    # hub under `/api`, and that is a correctness requirement rather than
    # taste: the signed envelope binds the concrete request path, so
    # mounting the hub under a prefix makes every authenticated request
    # fail its own signature (§4.6). The hub's CORS layer already allows
    # any origin for GETs, which is what the site needs and nothing more.
    server_name hub.itx.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.itx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.itx.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Deliberately NO `ssl_stapling`. It was on here, and it was two
    # bugs at once: OCSP stapling needs a `resolver` to look the OCSP
    # responder up, and without one nginx logs
    # "ssl_stapling ignored, no resolver defined" and staples nothing --
    # so it never did anything. And Let's Encrypt has since dropped OCSP
    # entirely, so there is no responder left to staple from. Turning it
    # on with a resolver today would only add a failing lookup to every
    # handshake path.

    # Two years, and only set here -- never on the :80 block, where a
    # client that has not yet been upgraded would cache it from an
    # unauthenticated response.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Body cap: see the Caddyfile's note for the derivation. 256k here
    # is 262,144 bytes, which is exactly what the Caddyfile's
    # `max_size 262144` is -- these two used to read `64k` and `64KB`
    # and differ by 1,536 bytes, because nginx's k is 1024 and Caddy's
    # KB is 1000. Short version of the derivation: the hub accepts
    # 20,000-character text fields, the SDK escapes non-ASCII as \uXXXX,
    # and an emoji costs 12 bytes that way, so 240,000 bytes is a body
    # the hub would accept and the proxy must not 413.
    client_max_body_size 256k;

    # Slowloris bounds. nginx's defaults are 60s each, which is a long
    # time to hold a worker for a client sending one byte a minute.
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     75s;

    access_log /var/log/nginx/itx-access.log;
    error_log  /var/log/nginx/itx-error.log warn;

    # RFC 9116 disclosure contact. Served here because the hub's router
    # has no route for it. An exact-match location outranks the catch-all
    # below regardless of order, but it is written first anyway so the
    # exception is visible before the rule.
    #     sudo install -Dm644 deploy/security.txt \
    #         /etc/nginx/well-known/security.txt
    location = /.well-known/security.txt {
        alias /etc/nginx/well-known/security.txt;
        default_type text/plain;
        # RFC 9116 §3 requires the file be served as UTF-8, and nginx
        # will not say so on its own -- `default_type text/plain` alone
        # emits a Content-Type with no charset. `charset` appends it
        # (text/plain is in nginx's default charset_types), matching what
        # the Caddyfile sets by hand.
        charset utf-8;
    }

    # `/metrics` is not for the internet. It carries the custody balance,
    # the exchange's liabilities, the faucet budget's remaining headroom
    # and the reconciliation disagreement counters -- an operational
    # picture of the treasury, unauthenticated, on a route the hub does
    # not gate because inside the box it does not need to be.
    #
    # Shipped blocked rather than left to the operator. The runbook has
    # said to add this since the metrics endpoint landed, and neither
    # shipped config contained it, so the documented state and the
    # shipped state disagreed -- which is the same as not documenting it.
    # Scrape from the box (`curl -s localhost:9100/metrics`), or add the
    # monitoring host to the allow list.
    #
    # Exact match, so it cannot be walked around with `/metrics/` or a
    # query string, and it outranks the prefix location below regardless
    # of order.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location / {
        # `proxy_pass` with no URI part -- no trailing slash, no path
        # after the port. That is what makes nginx pass the request path
        # through byte-for-byte, and it is load-bearing. The signed
        # envelope binds method and concrete path, and the hub verifies
        # against `OriginalUri`, so adding a trailing slash here (or
        # mounting the hub under /api) rewrites the path out from under
        # the signature: every authenticated request 401s, all of them,
        # with nothing in either log explaining it. See
        # docs/deployment.md §4.6.
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        # THE security-relevant line.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The usual idiom
        # appends the peer to whatever the client sent; the hub reads
        # right to left past its own proxies (hub/src/rate_limit.rs,
        # client_ip) so that would in fact be safe today. Replacing makes
        # it safe under any reader: exactly one entry, the one we saw,
        # with the client's own claim discarded here.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Client-supplied variants the hub does not read today. Cleared
        # so they cannot become a bypass if it ever does. An empty value
        # is how nginx removes a header from the upstream request.
        proxy_set_header Forwarded  "";
        proxy_set_header X-Real-IP  "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # The hub already gzips (CompressionLayer in build_router), so
        # nginx must not try to as well. It must, however, be willing to
        # pass a compressed response through untouched.
        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }
}

# The site. Static files, no hub behind it, and the only thing a human
# visiting the domain reaches.
#
#     sudo cp -r site/. /var/www/itx/      # from the release tarball
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itx.example.com;

    ssl_certificate     /etc/letsencrypt/live/itx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itx.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/itx;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/itx-site-access.log;
    error_log  /var/log/nginx/itx-site-error.log warn;

    # Vite emits content-addressed filenames, so an asset under /assets/
    # can be cached hard: a changed file is a changed name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Three paths that are NOT the single-page app.
    #
    # The `location /` below answers every unknown path with index.html
    # and a 200, which is right for a route the router owns and wrong for
    # a file the outside world was told to fetch. Until 2026-09-09 that
    # swallowed all three of these: `/llms.txt` served a page of HTML to
    # an agent expecting the manual, `/.well-known/security.txt` served
    # HTML to a researcher, and `/health` answered 200 with the hub dead
    # -- which is what §3's off-box check and §8.2's monitoring curl. A
    # 200 full of markup is the worst answer available: it satisfies a
    # status-code check and means nothing.
    #
    # An exact-match location outranks a prefix one and a regex outranks
    # both, so all three win over `location /` wherever they are written.

    # RFC 9116 disclosure contact, on the apex because that is where
    # `Canonical:` in the file itself says it lives, and where a
    # researcher and every automated scanner look first. Same file and
    # same install step as the API block's copy:
    #     sudo install -Dm644 deploy/security.txt \
    #         /etc/nginx/well-known/security.txt
    location = /.well-known/security.txt {
        alias /etc/nginx/well-known/security.txt;
        default_type text/plain;
        charset utf-8;
    }

    # `/llms.txt` and `/health`, forwarded to the hub.
    #
    # The manual is served by the hub itself so it cannot drift from the
    # running constants, and the README's one-line paste hands a stranger
    # the site's domain -- an agent should not have to know the API is on
    # another hostname to read the instructions for using it. `/health`
    # is the one §3 says to curl from another machine, and it has to
    # reach the hub to mean anything.
    #
    # `proxy_pass` with no URI part, as in the API block: that is what
    # passes the path through byte-for-byte, and it is the only form
    # allowed in a regex location anyway.
    #
    # The five header lines are the API block's, and MUST stay identical
    # to them -- `$remote_addr` rather than `$proxy_add_x_forwarded_for`
    # is the security-relevant one, and the hub's rate limiter charges by
    # the address it is handed. nginx has no snippets without a second
    # file to install, which is why this is a copy; deploy/Caddyfile
    # states them once and imports them twice.
    location ~ ^/(llms\.txt|health)$ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Forwarded  "";
        proxy_set_header X-Real-IP  "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # Single-page app. An unknown path is a route the router owns, not a
    # missing file, so it gets index.html and React decides -- a real 404
    # for /nothing-here would break every deep link on the site.
    #
    # index.html itself is never cached: it is what points at the current
    # asset hashes, and a stale copy serves a bundle that no longer exists.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
