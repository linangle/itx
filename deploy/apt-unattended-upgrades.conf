// Nightly security updates, applied by the box itself.
//
//     sudo apt-get install -y unattended-upgrades
//     sudo cp deploy/apt-unattended-upgrades.conf /etc/apt/apt.conf.d/52-itx-unattended-upgrades
//     sudo apt-config dump | grep -E 'Unattended-Upgrade::(Origins|Automatic-Reboot)'
//     sudo unattended-upgrade --dry-run --debug
//
// **The `52-` prefix is load-bearing**, the same way the SSH drop-in's
// `01-` is and for the opposite reason: apt reads `apt.conf.d` in
// lexical order and the LAST value wins, so this has to sort after the
// package's own `50unattended-upgrades` to override it.
//
// Why this is here at all: the deployment's own software is pinned to a
// release you install by hand (§5.2), but the sshd and the proxy that
// face the internet come from the distribution, and nothing else on this
// box updates them. An unpatched public sshd is how a box that is
// otherwise carefully run gets taken.

// The two knobs that make it actually run, nightly, through
// apt-daily.timer and apt-daily-upgrade.timer.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

// Security only. The full archive would also bring feature updates to
// anything installed, on a box whose whole operating discipline is that
// changes are deliberate and reversible (§5.2). Both distributions are
// listed because this file is meant to be copied to whichever one the
// host runs; an origin that does not exist on it is simply never matched.
//
// `#clear` first, because an apt *list* accumulates across apt.conf.d
// rather than being overridden by the last file to set it. Without it
// this block appends to whatever `50unattended-upgrades` shipped and the
// origins that actually apply are the union of the two -- which is not
// what a file saying "security only" reads as. On Debian that union
// includes the main archive (`label=Debian`), which carries point
// releases as well as security fixes. Ubuntu keeps its defaults in a
// different list, `Allowed-Origins` (its release, security and ESM
// security pockets), which this file leaves alone.
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename},label=Debian-Security";
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
    "origin=Ubuntu,archive=${distro_codename}-security,label=Ubuntu";
};

// **No automatic reboot.** A kernel update that reboots the box at 06:00
// takes the node, the miner and the hub down with it. They all come back
// on `Restart=always` and the chain is committed per block (§7.2), so
// this is survivable rather than dangerous -- but a treasury host should
// not choose its own downtime, and a reboot that happens while nobody is
// watching is one nobody checks the recovery of.
//
// The cost of `false` is that a kernel patch sits installed and unused
// until you reboot, so the check belongs in the routine: read
// `/var/run/reboot-required` (§8) and take the window deliberately.
Unattended-Upgrade::Automatic-Reboot "false";

// Services whose libraries were replaced are restarted in place instead,
// which is what keeps a patched openssl actually running without one.
// The hub drains in-flight requests on SIGTERM (§5), so a restart here
// costs nothing in flight.
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

// Keep what it did. This is the log you read when something on the box
// changed behaviour overnight and nobody deployed anything.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
Unattended-Upgrade::SyslogEnable "true";
