#!/usr/sbin/nft -f
#
# ITX single-box firewall.
#
# Default deny inbound. The only port that faces the internet is 443 (the
# reverse proxy). The hub's own HTTP port and the node's wire port are
# reachable on loopback only.
#
# This is not defence in depth for the hub: hub/src/main.rs binds
# 0.0.0.0 unconditionally and has no --bind flag, so this ruleset is the
# ONLY thing keeping cleartext hub traffic off the internet. See
# docs/deployment.md §1.
#
# Check before applying -- a bad ruleset with a default-deny policy and no
# ssh rule locks you out of the box holding the treasury:
#     sudo nft -c -f /etc/nftables.conf

flush ruleset

define HUB_PORT  = 9100
define NODE_PORT = 9000

# Set this to the addresses you actually administer from. Leaving it as
# 0.0.0.0/0 works, but then ssh is exposed to the whole internet and the
# only thing between an attacker and the treasury box is sshd's own auth.
define SSH_ALLOWED = { 0.0.0.0/0 }

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Established flows first: this is what lets the box's own
        # outbound connections (package updates, the miner dialling the
        # node, the hub dialling the node) get their replies back.
        ct state established,related accept
        ct state invalid drop

        iif lo accept

        # ICMP: keep echo and, more importantly, the unreachable/
        # fragmentation-needed messages that path MTU discovery depends
        # on. Dropping all ICMP is a classic way to make TLS hang for
        # some clients and nobody else.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        tcp dport 22 ip saddr $SSH_ALLOWED ct state new limit rate 10/minute accept

        # The public surface, in its entirety.
        tcp dport { 80, 443 } accept

        # Explicit drops for the two internal ports. Redundant under
        # `policy drop` -- kept because they are the intent of this file,
        # and a counter on each is how you notice someone scanning for
        # them. Read them with: nft list ruleset -a -s
        tcp dport $HUB_PORT  counter drop comment "hub http: loopback only, proxy reaches it via lo"
        tcp dport $NODE_PORT counter drop comment "node wire protocol: unauthenticated, never expose"

        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
