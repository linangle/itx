#!/usr/sbin/nft -f
#
# ITX single-box firewall.
#
# Default deny inbound. The only port that faces the internet is 443 (the
# reverse proxy). The hub's own HTTP port and the node's wire port are
# reachable on loopback only.
#
# This is not defence in depth for the hub: hub/src/main.rs binds
# 0.0.0.0 unconditionally and has no --bind flag, so this ruleset is the
# ONLY thing keeping cleartext hub traffic off the internet. See
# docs/deployment.md §1.
#
# Check before applying -- a bad ruleset with a default-deny policy and no
# ssh rule locks you out of the box holding the treasury:
#     sudo nft -c -f /etc/nftables.conf

# Replaces only this file's own table, atomically. The line without a
# body creates `inet itx` if it does not exist, so the delete below
# cannot fail on a fresh box; the delete then clears whatever was there,
# and the definition that follows rebuilds it -- all in one transaction.
#
# This used to be `flush ruleset`, which is not the same thing at all:
# it destroys EVERY table on the host, including the ones fail2ban,
# docker, libvirt and podman create and then assume are still theirs.
# Reloading this file would silently unban every fail2ban IP and take
# out container networking until those daemons happened to rewrite their
# own rules.
table inet itx
delete table inet itx

define HUB_PORT  = 9100
define NODE_PORT = 9000

# Restricting ssh to the addresses you administer from is worth doing.
# If you do it, fill in BOTH of these and uncomment BOTH rules in the
# input chain -- see the note there for why one of them alone is a
# lockout rather than a restriction.
#
# define SSH_ALLOWED_V4 = { 198.51.100.7 }
# define SSH_ALLOWED_V6 = { 2001:db8:1::7 }

table inet itx {
    chain input {
        type filter hook input priority filter; policy drop;

        # Established flows first: this is what lets the box's own
        # outbound connections (package updates, the miner dialling the
        # node, the hub dialling the node) get their replies back.
        ct state established,related accept
        ct state invalid drop

        iif lo accept

        # ICMP: keep echo and, more importantly, the unreachable/
        # fragmentation-needed messages that path MTU discovery depends
        # on. Dropping all ICMP is a classic way to make TLS hang for
        # some clients and nobody else.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        # `meta l4proto ipv6-icmp`, not `ip6 nexthdr icmpv6`: nexthdr
        # matches only the FIRST header after the IPv6 one, so an ICMPv6
        # packet carrying any extension header (a hop-by-hop or
        # fragment header, which neighbour discovery and PMTUD traffic
        # legitimately do) does not match and gets dropped. meta l4proto
        # is the kernel's own resolved upper-layer protocol and sees
        # through the header chain.
        meta l4proto ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # SSH, over BOTH address families.
        #
        # This rule used to read `tcp dport 22 ip saddr $SSH_ALLOWED`,
        # with SSH_ALLOWED defaulting to { 0.0.0.0/0 }. Inside an `inet`
        # table an `ip saddr` match is IPv4-only, so every inbound IPv6
        # ssh connection missed it and fell through to the policy drop
        # below -- and ssh prefers IPv6 when a host has an AAAA record,
        # which most hosted boxes do. That is precisely the lockout this
        # file's header warns about, on the box holding the treasury.
        #
        # The default is therefore no source match at all: port and rate
        # limit only, both families. That also retires the
        # `{ 0.0.0.0/0 }` set, which was a second, quieter problem -- a
        # zero-length prefix in an anonymous set has misbehaved on older
        # nft, and "match every address" is better expressed by not
        # matching on address.
        tcp dport 22 ct state new limit rate 10/minute accept

        # To restrict by source instead, fill in both defines above,
        # comment out the rule above, and uncomment BOTH of these. One
        # without the other is the IPv4-only bug again.
        # tcp dport 22 ip  saddr $SSH_ALLOWED_V4 ct state new limit rate 10/minute accept
        # tcp dport 22 ip6 saddr $SSH_ALLOWED_V6 ct state new limit rate 10/minute accept

        # The public surface, in its entirety.
        tcp dport { 80, 443 } accept

        # Explicit drops for the two internal ports. Redundant under
        # `policy drop` -- kept because they are the intent of this file,
        # and a counter on each is how you notice someone scanning for
        # them. Read them with: nft list ruleset -a -s
        tcp dport $HUB_PORT  counter drop comment "hub http: loopback only, proxy reaches it via lo"
        tcp dport $NODE_PORT counter drop comment "node wire protocol: unauthenticated, never expose"

        counter drop
    }

    chain forward {
        # Correct for the single box §2 describes, which routes nothing:
        # with net.ipv4.ip_forward=0 (the default) this chain never sees
        # a packet, and if forwarding is ever turned on by accident it
        # stays off by policy.
        #
        # It is also the chain that breaks container networking, and the
        # failure is not obvious, so it is worth stating: docker, podman
        # and libvirt turn forwarding on and add their own accept rules
        # in their own tables. A packet has to survive EVERY table's
        # forward chain, so their accept cannot override this drop --
        # containers simply lose all outbound and inter-container
        # traffic. If you run containers on this box, delete this chain
        # (they install their own filtering) rather than trying to poke
        # holes in it.
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
