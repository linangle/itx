# SSH for the box holding the treasury: keys only, nothing else.
#
# Installed as a drop-in, not by editing sshd_config:
#
#     sudo cp deploy/sshd-itx.conf /etc/ssh/sshd_config.d/01-itx.conf
#     sudo sshd -t && sudo systemctl reload ssh
#
# **The `01-` prefix is load-bearing.** Debian and Ubuntu put
# `Include /etc/ssh/sshd_config.d/*.conf` at the TOP of sshd_config, and
# sshd takes the FIRST value it sees for a keyword, not the last. Cloud
# images ship `50-cloud-init.conf`, which on a good many of them says
# `PasswordAuthentication yes`. A file named `60-itx.conf` sorts after it,
# loses every keyword they both set, and leaves password login on while
# looking installed.
#
# Read back what sshd actually resolved, rather than trusting the file:
#
#     sudo sshd -T | grep -E '^(passwordauthentication|permitrootlogin|kbdinteractiveauthentication|pubkeyauthentication)'
#
# and keep the session that reloaded it open until a NEW one logs in --
# the same discipline §3 asks for on the firewall, for the same reason.

# The point of the file. A password is a secret someone can guess from
# anywhere in the world at whatever rate the network allows; the box is
# found by scanners within hours of getting a public address.
PasswordAuthentication no
PubkeyAuthentication yes

# The other way a password reaches sshd. Leaving this on while
# `PasswordAuthentication` is off is the classic half-hardened box: PAM
# asks for the password through the keyboard-interactive path instead,
# and the login works exactly as before.
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# `prohibit-password`, not `no`, on purpose: root with a key still works.
# Some providers hand over a box whose only account is root, and `no`
# there is a lockout rather than a hardening step. Once you have an
# ordinary admin account with sudo and have logged in as it, change this
# to `no` and reload.
PermitRootLogin prohibit-password

# Only these accounts may log in at all. Commented out because the name
# depends on the box -- fill in your admin account and uncomment. Note
# that `itx` (the unprivileged user the services run as, §5) is
# deliberately not one of them: nothing should be logging in as the
# account that can read the secrets directory.
# AllowUsers admin

# A scan that opens a connection and tries three keys is over in a
# second; the default ten gives it three times the budget for free.
MaxAuthTries 3
# And a connection that opens and then says nothing holds a slot for two
# minutes by default. Twenty seconds is ample for a real login.
LoginGraceTime 20

# Nothing here needs a forwarded display or a forwarded agent, and an
# agent forwarded into this box can be used by whoever is already on it
# to reach the machine you came from.
X11Forwarding no
AllowAgentForwarding no

# Port forwarding stays ON, deliberately: §8.6's console binds
# 127.0.0.1:8787 with no login of its own, and an SSH tunnel is how a
# second operator is meant to reach it. Turning this off does not harden
# the console, it just removes the only supported way in.
AllowTcpForwarding yes
